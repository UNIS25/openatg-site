project_id = "varathans25-premium-platform"
[api]
enabled = true
port = 58531
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500
[db]
port = 58532
shadow_port = 58530
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = true
port = 58533
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 58534
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:4190"
additional_redirect_urls = ["http://127.0.0.1:4190/auth/callback"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 14
password_requirements = "lower_upper_letters_digits_symbols"
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_expiry = 900
[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30
[auth.sessions]
timebox = "8h"
inactivity_timeout = "1h"
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[edge_runtime]
enabled = false
[analytics]
enabled = false

[auth.email.template.confirmation]
subject = "Varathans25 · E-Mail bestätigen / Confirmer / Confirm"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Varathans25 · Passwort / Mot de passe / Password"
content_path = "./supabase/templates/recovery.html"
